# Transformer fine-tuning configuration optimized for local NVIDIA RTX 4060 8GB
model_name: "uitnlp/visobert" # uitnlp/visobert | vinai/phobert-base-v2
random_state: 42

training:
  output_dir: "models/checkpoints/"
  num_train_epochs: 4
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 2 # Effective batch size = 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: true # Mixed precision on RTX 4060
  bf16: false
  eval_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "eval_macro_f1"
  greater_is_better: true
  save_total_limit: 2
  dataloader_num_workers: 2
  logging_steps: 50

tokenizer:
  max_length: 160 # Optimized based on 95th percentile sentence length

labels:
  0: "CLEAN"
  1: "OFFENSIVE"
  2: "HATE"
