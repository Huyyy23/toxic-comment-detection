# Baseline configuration: TF-IDF + Classifier for 3-class Toxic Comment Detection
model_type: "logistic_regression" # logistic_regression | linear_svc
random_state: 42

tfidf:
  ngram_range_word: [1, 2]
  ngram_range_char: [2, 4]
  max_features: 10000
  sublinear_tf: true
  min_df: 2

classifier:
  C: 1.0
  class_weight: "balanced"
  max_iter: 1000

labels:
  0: "CLEAN"
  1: "OFFENSIVE"
  2: "HATE"
