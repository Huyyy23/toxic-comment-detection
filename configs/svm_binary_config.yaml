# SVM Binary Config — N6 TV2 (Vinh)
# Source of truth: SPEC v5.0.0 (2026-11-23) & binary_n2_v1 / binary_n4_v1
# Quy tắc:
#   - Chỉ đọc train.parquet và val.parquet; tuyệt đối không mở test.parquet trước N10.
#   - Fit TF-IDF, SelectKBest và CalibratedClassifierCV CHỈ trên train / train-fold.
#   - Chọn mô hình bằng raw Validation Macro-F1 trước; calibration/threshold là bước hậu kỳ cho inference.

experiment: N6-SVM-Binary
owner: TV2
seeds: [42, 43, 44]
data_contract_version: "binary_n2_v1"
dataset_dir: data/processed/binary_n2_v1
augmentation_path: data/processed/binary_n4_v1/augmentation.parquet
tracking_uri: null  # null = local store (mlruns/)
max_fallback_size_mb: 15.0

calibration:
  method: sigmoid  # Platt scaling (ADR-03)
  cv: 5
  n_ece_bins: 10
  threshold_grid_min: 0.10
  threshold_grid_max: 0.90
  threshold_grid_step: 0.01

variants:
  A:
    description: "Baseline nhị phân: raw text + word TF-IDF (1-2 gram) + LinearSVC (C=1.0)"
    hypothesis: >
      LinearSVC trên word TF-IDF 1-2 gram thiết lập mốc baseline nhị phân (CLEAN vs TOXIC)
      trên tập gộp ViHSD + ViCTSD.
    use_augmentation: false
    preprocessing: raw
    tfidf:
      mode: word
      word_ngram_range: [1, 2]
      char_ngram_range: [2, 4]
      max_features: 100000
      sublinear_tf: true
      min_df: 2
    feature_selection:
      enabled: false
      method: chi2
      k: null
    svm:
      kernel: linear
      C: 1.0
      class_weight: null
      max_iter: 5000
      dual: auto

  B:
    description: "Basic cleanup + word+char TF-IDF + LinearSVC (C=1.0)"
    hypothesis: >
      Thêm basic cleanup và char_wb n-grams (2-4) giúp LinearSVC bắt được teencode,
      từ viết tắt và biến thể chính tả tiếng Việt trên cả hai nguồn ViHSD và ViCTSD.
    use_augmentation: false
    preprocessing: basic
    tfidf:
      mode: "word+char"
      word_ngram_range: [1, 2]
      char_ngram_range: [2, 4]
      max_features: 100000
      sublinear_tf: true
      min_df: 2
    feature_selection:
      enabled: false
      method: chi2
      k: null
    svm:
      kernel: linear
      C: 1.0
      class_weight: null
      max_iter: 5000
      dual: auto

  C:
    description: "Teencode norm + word+char TF-IDF + chi2 feature selection + tuning C/class_weight"
    hypothesis: >
      Chuẩn hóa teencode kết hợp chọn lọc đặc trưng chi2 và xử lý imbalance bằng
      class_weight='balanced' + điều chuẩn C giúp cải thiện Validation Macro-F1 và F1 TOXIC.
    use_augmentation: false
    preprocessing: teencode
    tfidf:
      mode: "word+char"
      word_ngram_range: [1, 3]
      char_ngram_range: [2, 5]
      max_features: 150000
      sublinear_tf: true
      min_df: 2
    feature_selection:
      enabled: true
      method: chi2
      k: 100000
    svm:
      kernel: linear
      C: 0.5
      class_weight: balanced
      max_iter: 5000
      dual: auto
    tuning_grid:
      k_candidates: [20000, 50000, 100000, null]
      C_candidates: [0.05, 0.1, 0.2, 0.5, 1.0, 2.0]
      class_weight_candidates: [null, "balanced"]

  D:
    description: "Ablation N4: Cấu hình tốt nhất + binary_n4_v1 train-only TOXIC augmentation"
    hypothesis: >
      Bổ sung 5,675 mẫu TOXIC tăng cường chỉ vào train (nâng tỷ lệ TOXIC lên 30.0%)
      có thể thay đổi cân bằng giữa precision và recall của lớp TOXIC trên validation.
    use_augmentation: true
    preprocessing: teencode
    tfidf:
      mode: "word+char"
      word_ngram_range: [1, 3]
      char_ngram_range: [2, 5]
      max_features: 150000
      sublinear_tf: true
      min_df: 2
    feature_selection:
      enabled: true
      method: chi2
      k: 100000
    svm:
      kernel: linear
      C: 0.5
      class_weight: balanced
      max_iter: 5000
      dual: auto
    tuning_grid:
      k_candidates: [100000]
      C_candidates: [0.1, 0.2, 0.5, 1.0]
      class_weight_candidates: [null, "balanced"]
