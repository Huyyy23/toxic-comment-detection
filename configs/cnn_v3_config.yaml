version: "3.0.0"
experiment: "TV4-CNN-V3"
experiment_id: "EXP-04-V3"
owner: "TV4"
dataset_dir: "data/processed/binary_n2_v1"
n4_dataset_dir: "data/processed/binary_n4_training_v1"
seeds: [42, 43, 44]
device: "auto"

defaults:
  max_word_length: 144
  max_char_length: 400
  batch_size: 64
  epochs: 12
  patience: 3
  learning_rate: 0.001
  grad_clip: 1.0
  weight_decay: 0.0001
  imbalance_method: "none"
  focal_gamma: 2.0
  min_word_freq: 2
  min_char_freq: 2
  use_amp: false
  lr_scheduler: "cosine"
  train_aug_mode: "none"
  label_smoothing: 0.0
  init_fasttext_train_only: false

variants:
  # =========================================================================
  # V3-A1: Gated Attention + Max + Mean + LayerNorm + Multi-Sample Dropout
  # =========================================================================
  V3-BIGRU-GATED-MSD:
    description: "BiGRU (GatedAttn+Max+Mean) + Char-CNN [2,3,4,5,7] + LayerNorm + Multi-Sample Dropout + label_smoothing=0.03"
    hypothesis: "Gated attention (Ilse et al. 2018) suppresses false-positive lexical triggers in negated/slang CLEAN comments, while LayerNorm + 5-head Multi-Sample Dropout + label_smoothing=0.03 improves Macro-F1 and reduces overconfidence ECE."
    architecture: "bigru_char_cnn"
    preprocessing: "v3_word_norm"
    word_preprocessing: "v3_word_norm"
    char_preprocessing: "v2_char_norm"
    weight_decay: 0.0001
    learning_rate: 0.001
    lr_scheduler: "cosine"
    label_smoothing: 0.03
    model:
      embedding_dim: 128
      char_embedding_dim: 64
      hidden_size: 128
      char_kernel_sizes: [2, 3, 4, 5, 7]
      num_filters: 128
      dropout: 0.40
      rnn_pooling: "gated_attn_max_mean"
      spatial_dropout: 0.15
      word_dropout: 0.35
      char_dropout: 0.20
      use_layernorm: true
      multi_sample_dropout: true

  # =========================================================================
  # V3-A2: Train-Only Subword FastText Init (100% Scratch, D2-compliant)
  # =========================================================================
  V3-BIGRU-GATED-FT:
    description: "V3-BIGRU-GATED-MSD + Train-Only Gensim FastText 128D Subword Embedding Init (min_n=2..5)"
    hypothesis: "Initializing word embeddings with train-only subword FastText vectors transfers morphological similarity to rare toxic compounds, typos, and unaccented words without any external pretraining."
    architecture: "bigru_char_cnn"
    preprocessing: "v3_word_norm"
    word_preprocessing: "v3_word_norm"
    char_preprocessing: "v2_char_norm"
    weight_decay: 0.0001
    learning_rate: 0.001
    lr_scheduler: "cosine"
    label_smoothing: 0.03
    init_fasttext_train_only: true
    model:
      embedding_dim: 128
      char_embedding_dim: 64
      hidden_size: 128
      char_kernel_sizes: [2, 3, 4, 5, 7]
      num_filters: 128
      dropout: 0.40
      rnn_pooling: "gated_attn_max_mean"
      spatial_dropout: 0.15
      word_dropout: 0.35
      char_dropout: 0.20
      use_layernorm: true
      multi_sample_dropout: true

  # =========================================================================
  # V3-A3: PyVi Compound-Word Segmented + Train-Only FastText + GatedAttn
  # =========================================================================
  V3-BIGRU-PYVI-FT:
    description: "V3-BIGRU-GATED-FT with PyVi Vietnamese compound word segmentation (v3_word_pyvi)"
    hypothesis: "Segmenting Vietnamese multi-syllable compounds ('vô_học', 'mất_dạy', 'không_phải', 'phản_động') via PyVi gives the BiGRU direct compound tokens, targeting hard ViCTSD indirect toxicity and negation."
    architecture: "bigru_char_cnn"
    preprocessing: "v3_word_pyvi"
    word_preprocessing: "v3_word_pyvi"
    char_preprocessing: "v2_char_norm"
    weight_decay: 0.0001
    learning_rate: 0.001
    lr_scheduler: "cosine"
    label_smoothing: 0.03
    init_fasttext_train_only: true
    model:
      embedding_dim: 128
      char_embedding_dim: 64
      hidden_size: 128
      char_kernel_sizes: [2, 3, 4, 5, 7]
      num_filters: 128
      dropout: 0.40
      rnn_pooling: "gated_attn_max_mean"
      spatial_dropout: 0.15
      word_dropout: 0.35
      char_dropout: 0.20
      use_layernorm: true
      multi_sample_dropout: true

  # =========================================================================
  # V3-A4: Tri-Branch Hybrid (Word-CNN + BiGRU GatedAttn + Char-CNN) + Train-Only FastText
  # =========================================================================
  V3-TRI-GATED-FT:
    description: "Tri-Hybrid Word-CNN [2,3,4] + BiGRU (Attn+Max) + Char-CNN [2,3,4,5,7] + Train-Only FastText + label_smoothing=0.03"
    hypothesis: "Fusing local Word-CNN n-grams, sequential BiGRU, and Char-CNN initialized with train-only FastText creates high diversity and strong ViHSD + ViCTSD accuracy."
    architecture: "word_cnn_bigru_char_cnn"
    preprocessing: "v3_word_norm"
    word_preprocessing: "v3_word_norm"
    char_preprocessing: "v2_char_norm"
    weight_decay: 0.0001
    learning_rate: 0.001
    lr_scheduler: "cosine"
    label_smoothing: 0.03
    init_fasttext_train_only: true
    model:
      embedding_dim: 128
      char_embedding_dim: 64
      kernel_sizes: [2, 3, 4]
      char_kernel_sizes: [2, 3, 4, 5, 7]
      word_num_filters: 128
      char_num_filters: 128
      hidden_size: 128
      fusion_type: "gated"
      fusion_dim: 256
      dropout: 0.40
      spatial_dropout: 0.15
